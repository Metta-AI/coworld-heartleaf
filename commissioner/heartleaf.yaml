# Heartleaf ruleset-strategy commissioner config.
#
# Mirrors the bundled default config with one deviation:
# - Rounds run every 30 minutes (one Heartleaf day per round).
#
# Competition entrants are champions: each player fields exactly its current
# champion, so the league is not spammed with stale, benched versions of a
# player's earlier submissions. The 9 game seats are filled by duplicating the
# real champions (fill_seats: duplicate), not by seating outdated versions.

schedule_interval_minutes: 30

defaults:
  seating: baseline_window
  fill_seats: duplicate
  min_entries_to_start: 2
  stage:
    label: Round
    episodes: 1
    min_episodes_per_entrant: 1

divisions:
  qualifiers:
    name: Qualifiers
    level: -99
    match:
      name: Qualifiers
      type: staging
    entrants: qualifying
    min_entries_to_start: 1
    stages:
      - id: crash_check
        schedule:
          label: Qualifier
          self_play: true
          attempts: 2
          min_episodes_per_entrant: 2
        on_episode_complete:
          - id: qualified
            criteria:
              completed_episodes_gt: 0
            actions:
              - type: update_membership
                division: competition
                status: competing
                substatus: champion
          - id: disqualified
            criteria: otherwise
            actions:
              - type: update_membership
                status: disqualified
                substatus: inactive

  competition:
    name: Competition
    previous_name: Daily
    level: 1
    match:
      type: competition
    entrants: champions
