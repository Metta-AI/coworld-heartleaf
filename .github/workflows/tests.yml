name: Tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: treeform/setup-nim-action@v6
        with:
          nim-version: 2.2.10

      - name: Install locked dependencies
        shell: bash
        run: |
          # The workspace must be the parent of the checkout: Nimby 0.2
          # refuses to create one inside a git checkout, and Nim walks
          # up from the compiled file to find nim.cfg.
          cd ..
          nimby create
          nimby sync "$GITHUB_WORKSPACE/nimby.lock"

      - name: Build the game server
        run: nim c -d:release src/heartleaf.nim

      - name: Build the soul player
        run: nim c -d:release players/soul_player/soul_player.nim

      - name: Unit tests
        run: nim r tests/tests.nim

      - name: Integration tests
        run: HEARTLEAF_SERVER=out/heartleaf nim r tests/integration.nim
