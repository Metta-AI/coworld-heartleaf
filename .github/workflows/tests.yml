name: Tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  eval-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          # The pinned coworld and softmax-cli wheels declare Python >=3.11,<3.13.
          python-version: '3.12'
      - name: Evaluation runner contract tests
        run: |
          python -m venv tmp/heartleaf-eval-venv
          tmp/heartleaf-eval-venv/bin/pip install -r eval/requirements.txt
          tmp/heartleaf-eval-venv/bin/python -m unittest discover -s eval/tests -p 'test_heartleaf_eval*.py'
      - name: Training exporter contract tests
        run: python -m unittest discover -s tests -p 'test_export_posttrain.py'

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: treeform/setup-nim-action@v6
        with:
          nim-version: 2.2.10

      - name: Install locked dependencies
        shell: bash
        run: |
          # The workspace must be the parent of the checkout: Nimby 0.2
          # refuses to create one inside a git checkout, and Nim walks
          # up from the compiled file to find nim.cfg.
          cd ..
          nimby create
          nimby sync "$GITHUB_WORKSPACE/nimby.lock"

      - name: Build the game server
        run: nim c -d:release src/heartleaf.nim

      - name: Build the soul player
        run: nim c -d:release players/soul_player/soul_player.nim

      - name: Build the offline training bridge
        run: nim c -d:release tools/training_bridge.nim

      - name: Offline training bridge protocol tests
        run: python3 -m unittest discover -s tests -p 'test_training_bridge.py' -v

      - name: Unit tests
        run: |
          nim r tests/tests.nim
          nim r tests/connections.nim
          nim r tests/conversation_replanning.nim
          nim r tests/report_action_feedback.nim

      - name: Viewer and route regressions
        run: |
          nim r tests/viewer_stability.nim
          nim r tests/viewer_navigation.nim
          nim r tests/viewer_controls.nim
          nim r tests/real_replay_director.nim
          nim r tests/replay_dialogue_boundaries.nim
          nim r tests/bedtime_viewer.nim
          nim r tests/routes.nim
          nim r tools/record_viewer_scenario.nim out/viewer-scenario.replay
          nim r tools/record_connection_scenario.nim out/connections-scenario.replay
          nim r tests/connections_viewer.nim out/connections-scenario.replay
      - name: Bedrock transport concurrency regression
        run: |
          nim c tests/bedrock_transport.nim
          python3 tests/test_bedrock_transport.py --probe out/bedrock_transport

      - name: Integration tests
        run: HEARTLEAF_SERVER=out/heartleaf nim r tests/integration.nim

  static-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Build the pinned static replay viewer
        run: tools/build_replay_viewer.sh "$GITHUB_WORKSPACE/out/static-replay-viewer"
      - uses: actions/upload-artifact@v4
        with:
          name: static-replay-viewer
          path: out/static-replay-viewer/
