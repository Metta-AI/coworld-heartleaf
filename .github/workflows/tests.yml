name: Tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: treeform/setup-nim-action@v6
        with:
          nim-version: 2.2.10

      - name: Install locked dependencies
        shell: bash
        run: |
          # The workspace must be the parent of the checkout: Nimby 0.2
          # refuses to create one inside a git checkout, and Nim walks
          # up from the compiled file to find nim.cfg.
          cd ..
          nimby create
          nimby sync "$GITHUB_WORKSPACE/nimby.lock"

      - name: Build the game server
        run: nim c -d:release src/heartleaf.nim

      - name: Build the soul player
        run: nim c -d:release players/soul_player/soul_player.nim

      - name: Unit tests
        run: nim r tests/tests.nim

      - name: Viewer and route regressions
        run: |
          nim r tests/viewer_stability.nim
          nim r tests/viewer_navigation.nim
          nim r tests/viewer_controls.nim
          nim r tests/routes.nim
          nim r tools/record_viewer_scenario.nim out/viewer-scenario.replay

      - name: Integration tests
        run: HEARTLEAF_SERVER=out/heartleaf nim r tests/integration.nim

  static-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Build the pinned static replay viewer
        run: tools/build_replay_viewer.sh "$GITHUB_WORKSPACE/out/static-replay-viewer"
      - uses: actions/upload-artifact@v4
        with:
          name: static-replay-viewer
          path: out/static-replay-viewer/
