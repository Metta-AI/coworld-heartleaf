name: Github Actions
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libevdev-dev
      - name: Install Nim with nimby
        run: |
          curl -fsSL -o /usr/local/bin/nimby \
            https://github.com/treeform/nimby/releases/download/0.1.26/nimby-Linux-X64
          chmod +x /usr/local/bin/nimby
          nimby use 2.2.4
          echo "$HOME/.nimby/nim/bin" >> "$GITHUB_PATH"
      - run: nimby sync nimby.lock -g
      - run: nim check src/heartleaf.nim
      - run: nim r tests/tests.nim
